<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BMI Calculator</title>
  <!-- <link rel="stylesheet" href="style.css" /> -->
   <style>
        @import url('https://fonts.googleapis.com/css2?family=Mukta:wght@100&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0a0a0a, #303740);
        font-family: 'Mukta', sans-serif;
        }
        .container {
        width: 320px;
        padding: 20px;
        border: 1px solid rgba(249, 249, 249, 0.2);
        border-radius: 15px;
        box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.5);
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(5px);
        }
        .inner_box { font-size: 30px; color: rgba(255, 255, 255, 0.6); }
        #para {
        height: 140px;
        border: 1px solid rgba(249, 249, 249, 0.1);
        border-radius: 10px;
        margin: 15px 0;
        color: #d4d447;
        padding: 10px;
        font-size: 18px;
        background: rgba(0,0,0,0.2);
        overflow-y: auto;
        }
        .input-group { margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        input {
        width: 120px;
        height: 35px;
        border: 1px solid rgba(249, 249, 249, 0.3);
        border-radius: 8px;
        text-align: center;
        font-size: 20px;
        background: transparent;
        color: white;
        }
        button {
        cursor: pointer;
        transition: 0.3s;
        border: none;
        border-radius: 10px;
        width: 100%;
        height: 45px;
        font-size: 24px;
        margin-top: 10px;
        color: white;
        }
        #solve { background-color: rgba(7, 74, 36, 0.6); }
        #solve:active { transform: scale(0.98); }
        #reset { background-color: rgba(78, 6, 6, 0.6); font-size: 18px; height: 35px; }
        #converter {
        width: 40px;
        height: 40px;
        font-size: 18px;
        background: rgba(255,255,255,0.1);
        margin-left: auto;
        display: block;
        }   
   </style>
</head>
<body>
  <div class="container">
    <div class="inner_box">
      <div class="input-group">
        <label id="label1">Weight :</label>
        <input type="number" id="input1" placeholder="kg">
      </div>
      <div class="input-group">
        <label id="label2">Height :</label>
        <input type="number" id="input2" placeholder="cm">
      </div>
      <div id="para">Ready to calculate...</div>
      <button id="solve" onclick="solve()">Solve</button>
      <button id="reset" onclick="reset()">Reset</button>
      <button id="converter" onclick="atrate()">@</button>
    </div>
  </div>
  <script>
    let userName;
window.onload = function() {
  do {
    userName = prompt("Please enter your name for the record:");
  } while (!userName || userName.trim() === "");
};

let count = 0;

function solve() {
  let val1 = document.getElementById("input1").value;
  let val2 = document.getElementById("input2").value;

  if (!val1 || !val2) {
    document.getElementById("para").innerText = "Please fill both fields!";
    return;
  }

  if (count % 2 == 0) {
    let weight = parseFloat(val1);
    let heightCm = parseFloat(val2);
    let heightM = heightCm / 100;
    let bmi = (weight / (heightM * heightM)).toFixed(2);
    let min = (heightM * heightM * 18.5).toFixed(2);
    let max = (heightM * heightM * 24.9).toFixed(2);

    let range = "";
    if (bmi < 18.5) range = "Underweight";
    else if (bmi > 24.9) range = "Overweight";
    else range = "Normal";

    document.getElementById("para").innerText = 
      `Result for ${userName}:\nBMI: ${bmi} (${range})\nIdeal Range: ${min}kg - ${max}kg`;

    let dataObject = {
      name: userName,
      height: heightCm + " cm",
      weight: weight + " kg",
      bmi: bmi,
      minMax: `${min}-${max} kg`
    };

    fetch('https://script.google.com/macros/s/AKfycbwyhbme9ZXaBlIWZwpVcDljdhGDjdVmk9T5CuPiIIKZL20JjzgtmVr5MPpU_ZjGn8RD/exec', {
      method: 'POST',
      body: JSON.stringify({dataObject}),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    })
    .then(() => {
      document.getElementById('solve').innerText = "Solved";
      setTimeout(() => { document.getElementById('solve').innerText = 'Solve'; }, 1000);
    })
    .catch(err => {
      alert("Failed to save data.");
      console.error(err);
    });
  } else {
    let feet = parseFloat(val1);
    let inch = parseFloat(val2);
    let totalCm = ((feet * 12) + inch) * 2.54;
    document.getElementById("para").innerText = 
      `${feet}'${inch}" is approximately ${totalCm.toFixed(2)} cm.`;
  }
}

function reset() {
  do {
    userName = prompt("Please enter your name for the record:");
  } while (!userName || userName.trim() === "");
  document.getElementById("input1").value = "";
  document.getElementById("input2").value = "";
  document.getElementById("para").innerText = (count % 2 == 0) ? "BMI calculator.." : "Unit converter..";
}

function atrate() {
  count++;
  let isBmiMode = (count % 2 == 0);
  document.getElementById("label1").innerText = isBmiMode ? "Weight :" : "Feet :";
  document.getElementById("label2").innerText = isBmiMode ? "Height :" : "Inch :";
  document.getElementById("input1").placeholder = isBmiMode ? "kg" : "feet";
  document.getElementById("input2").placeholder = isBmiMode ? "cm" : "inch";
  document.getElementById("para").innerText = isBmiMode ? "BMI calculator.." : "Unit converter..";
  document.getElementById("converter").style.color = isBmiMode ? "white" : "#d4d447";
}   
  </script>
</body>
</html>
